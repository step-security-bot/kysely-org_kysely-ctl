# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    reviewers:
      - "igalklebanov"
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/bun
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/deno-package-json
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/node-cjs
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/node-esm-environments
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/node-esm-environments/packages/lib1
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/node-esm-environments/packages/lib2
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/node-esm-jsx
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/node-esm-top-level-await
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/node-esm-tsconfig-paths
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /examples/node-esm
    schedule:
      interval: daily
